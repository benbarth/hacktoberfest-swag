[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "hacktoberfest-swag-tools"
version = "1.0.0"
description = "Validation, link checking, and yearly rollover tooling."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.28.1,<1",
  "jsonschema[format]>=4.25,<5",
  "PyYAML>=6.0.2,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]

[project.scripts]
swag-automation = "hacktoberfest_swag.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["hacktoberfest_swag"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
