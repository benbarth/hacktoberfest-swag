name: "[ADD] New reward opportunity"
description: Share a current project-run contribution reward program.
title: "[ADD] "
labels:
  - enhancement
  - help wanted
body:
  - type: markdown
    attributes:
      value: >-
        This directory covers independent project rewards. For official 2026 Fests,
        use hacktoberfest.com.
  - type: input
    id: organization
    attributes:
      label: Organization or project
      placeholder: Acme Open Source
    validations:
      required: true
  - type: input
    id: website
    attributes:
      label: Project website
      placeholder: https://www.acme.example/
    validations:
      required: true
  - type: input
    id: details
    attributes:
      label: Public reward rules
      description: Link directly to eligibility, deadlines, availability, limits, and fulfillment details.
      placeholder: https://www.acme.example/hacktoberfest-2026/
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Contribution and reward summary
      description: Explain the useful work contributors should do and what the project offers in return.
      placeholder: Resolve an accepted issue and have the pull request reviewed and merged during October 2026.
    validations:
      required: true
  - type: checkboxes
    id: rewards
    attributes:
      label: Rewards
      description: Select every reward type that applies.
      options:
        - label: Glasses
        - label: Laptop
        - label: Face mask
        - label: Mug
        - label: Plant or tree planting
        - label: Shirt
        - label: Socks
        - label: Stickers
        - label: Swag pack
        - label: Other
    validations:
      required: true
  - type: checkboxes
    id: confirmation
    attributes:
      label: Confirmation
      options:
        - label: The program is public, current for 2026, and rewards meaningful contributions.
          required: true
        - label: I understand that inclusion here does not make this an official Hacktoberfest Fest.
          required: true
