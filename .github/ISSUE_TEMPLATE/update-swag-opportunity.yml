name: "[UPD] Update a reward opportunity"
description: Correct the rules, links, rewards, or availability of a current listing.
title: "[UPD] "
labels:
  - enhancement
  - help wanted
body:
  - type: input
    id: organization
    attributes:
      label: Organization or project
      placeholder: Acme Open Source
    validations:
      required: true
  - type: input
    id: listing
    attributes:
      label: Existing listing or source file
      placeholder: participants/2026/acme-open-source.yml
    validations:
      required: true
  - type: input
    id: details
    attributes:
      label: Current public reward rules
      placeholder: https://www.acme.example/hacktoberfest-2026/
    validations:
      required: true
  - type: textarea
    id: changes
    attributes:
      label: What changed?
      description: Include corrected eligibility, deadlines, availability, geographic limits, or fulfillment details.
    validations:
      required: true
  - type: checkboxes
    id: confirmation
    attributes:
      label: Confirmation
      options:
        - label: I checked this information against the linked public rules.
          required: true
