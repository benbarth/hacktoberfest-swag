name: Open a new season

on:
  schedule:
    - cron: "17 3 1 1 *"
  workflow_dispatch:

concurrency:
  group: yearly-rollover
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  rollover:
    name: Tag and prepare the season
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the default branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip

      - name: Install rollover tooling
        run: python -m pip install --disable-pip-version-check --no-input .

      - name: Resolve the season
        id: season
        run: |
          season="$(date -u +%Y)"
          echo "current=$season" >> "$GITHUB_OUTPUT"
          echo "previous=$((season - 1))" >> "$GITHUB_OUTPUT"

      - name: Preserve and prepare the season
        env:
          CURRENT_SEASON: ${{ steps.season.outputs.current }}
          PREVIOUS_SEASON: ${{ steps.season.outputs.previous }}
        run: |
          if ! git show-ref --verify --quiet "refs/tags/$PREVIOUS_SEASON"; then
            git tag "$PREVIOUS_SEASON" HEAD
          fi
          python -m hacktoberfest_swag rollover --season "$CURRENT_SEASON"

      - name: Commit and push
        env:
          CURRENT_SEASON: ${{ steps.season.outputs.current }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PREVIOUS_SEASON: ${{ steps.season.outputs.previous }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add participants
          if ! git diff --cached --quiet; then
            git commit -m "chore: prepare Hacktoberfest $CURRENT_SEASON"
          fi
          git push --atomic origin "HEAD:$DEFAULT_BRANCH" "refs/tags/$PREVIOUS_SEASON"
